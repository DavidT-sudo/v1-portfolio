name: CI

on:
  pull_request:
    branches: [main, dev, production]
  push:
    branches: [main, dev, production]

# Least-privilege token.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build the production image (no push) so the deployable
      # artifact is verified on every PR. Layer cache via GHA.
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: omerohm-portfolio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
